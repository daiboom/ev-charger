[package]
name = "ev-charger"
version = "0.1.0"
edition = "2021"  # 2024는 아직 안정적이지 않음
authors = ["Your Name <your.email@example.com>"]
description = "EV 충전기 키오스크 애플리케이션"
license = "MIT"

[dependencies]
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = [
    "accesskit", "default_fonts", "glow", "persistence"
] }

thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
image = "0.25"

[features]
default = []
# 하드웨어 인터페이스는 아직 없다. 시뮬레이터만 연결한다.
hardware = []
